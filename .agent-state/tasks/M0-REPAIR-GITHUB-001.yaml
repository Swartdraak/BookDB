  - command: python3 -c "import yaml; from pathlib import Path; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in sorted(Path('.agent-state/tasks').glob('*.yaml'))]; print('yaml_ok')"
    expected: yaml_ok
  - command: python3 -c "import os, subprocess; env = os.environ.copy(); env['GITHUB_TOKEN'] = 'placeholder'; subprocess.run(['python', 'tools/validate_agent_kit.py'], check=True, env=env)"
    expected: pass
required_reviewers:
  - qa-reviewer
  - security-reviewer
notes: Governance repair only.
