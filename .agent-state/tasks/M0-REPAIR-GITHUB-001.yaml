dependencies:
  - M0-RECOVERY-GITHUB-001
base_commit: c0f14f25ebad3ed0e947f677198ba6cbdc8e898f
acceptance_criteria:
  - The malformed task artifact parses cleanly with PyYAML and the governance validator passes.
  - The GitHub security workflow uses supported, resolvable action versions and valid token configuration for pull requests.
  - The repo governance validation and security supply-chain workflows pass in local reproduction and on the PR branch.
verification:
  - command: python tools/validate_agent_kit.py
