openapi: 3.1.0
info:
  title: BookDB API
  version: 0.3.0-s1
  license:
    name: Apache-2.0
  description: |
    BookDB canonical catalog API. All operations require a valid API key
    in the X-API-Key header. Missing/invalid/revoked/expired keys return
    401; insufficient scope returns 403; unknown resources return 404.
    Exceeding the shared rate limit returns 429 with Retry-After.
servers:
  - url: /api/v1
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    WorkID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    ExpressionID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    EditionID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    PersonID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    OrganizationID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Work:
      type: object
      required: [work_id, canonical_title, normalized_title, created_at, updated_at]
      properties:
        work_id: {type: string, format: uuid}
        canonical_title: {type: string}
        normalized_title: {type: string}
        language_code: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Expression:
      type: object
      required: [expression_id, work_id, language_code, expression_title, created_at, updated_at]
      properties:
        expression_id: {type: string, format: uuid}
        work_id: {type: string, format: uuid}
        language_code: {type: string}
        expression_title: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Edition:
      type: object
      required: [edition_id, expression_id, edition_title, created_at, updated_at]
      properties:
        edition_id: {type: string, format: uuid}
        expression_id: {type: string, format: uuid}
        edition_title: {type: string}
        format: {type: string, nullable: true}
        isbn13: {type: string, nullable: true}
        publication_date: {type: string, format: date, nullable: true}
        publisher_name: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Person:
      type: object
      required: [person_id, display_name, created_at, updated_at]
      properties:
        person_id: {type: string, format: uuid}
        display_name: {type: string}
        sort_name: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Organization:
      type: object
      required: [organization_id, display_name, created_at, updated_at]
      properties:
        organization_id: {type: string, format: uuid}
        display_name: {type: string}
        sort_name: {type: string, nullable: true}
        organization_kind: {type: string, nullable: true}
        parent_id: {type: string, format: uuid, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Resolution:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [resolved, ambiguous, not_found]}
        candidates:
          type: array
          items:
            type: object
            required: [target_type, target_id, status]
            properties:
              target_type: {type: string}
              target_id: {type: string, format: uuid}
              status: {type: string}
    Error:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
    Job:
      type: object
      required: [job_id, source_name, snapshot_id, status]
      properties:
        job_id: {type: string, format: uuid}
        source_name: {type: string}
        snapshot_id: {type: string}
        status:
          type: string
          enum: [pending, running, paused, completed, failed, quarantined]
        total_records: {type: integer, format: int64}
        processed: {type: integer, format: int64}
        accepted: {type: integer, format: int64}
        unchanged: {type: integer, format: int64}
        rejected: {type: integer, format: int64}
        quarantined: {type: integer, format: int64}
        error_message: {type: string}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    JobActionRequest:
      type: object
      properties:
        reason:
          type: string
          description: Required for the quarantine action; optional (ignored) otherwise.
  responses:
    Unauthorized:
      description: Missing, invalid, revoked, or expired API key
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Insufficient scope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: Rate limiting backend unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: The job state transition is not valid from the current state (stale admin view or concurrent transition)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BadRequest:
      description: Malformed job ID, unknown action, or quarantine without a reason
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
paths:
  /ingestion/jobs:
    get:
      summary: List ingestion jobs (administrator)
      description: >
        S4-ADMIN (BDB-011). Requires an authenticated administrator session;
        reader and contributor sessions receive 403. Optional query filters:
        source (source_name) and status.
      operationId: listIngestionJobs
      parameters:
        - in: query
          name: source
          required: false
          schema: {type: string}
        - in: query
          name: status
          required: false
          schema: {type: string}
        - in: query
          name: limit
          required: false
          schema: {type: integer, default: 50, maximum: 200}
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: {$ref: '#/components/schemas/Job'}
                  total: {type: integer}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
  /ingestion/jobs/{id}:
    get:
      summary: Get an ingestion job (administrator)
      operationId: getIngestionJob
      parameters:
        - $ref: '#/components/parameters/WorkID'
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
  /ingestion/jobs/{id}/{action}:
    post:
      summary: Transition an ingestion job (administrator)
      description: >
        S4-ADMIN (BDB-011). action is one of: pause (running -> paused),
        resume (paused -> running), retry (failed -> running), quarantine
        (running|paused|failed -> quarantined; a non-empty reason is
        required and is persisted on the job). A transition that is not
        valid from the job's current state returns 409 with no partial
        state change.
      operationId: transitionIngestionJob
      parameters:
        - $ref: '#/components/parameters/WorkID'
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum: [pause, resume, retry, quarantine]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobActionRequest'}
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        "400": {$ref: '#/components/responses/BadRequest'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
  /works/{id}:
    get:
      summary: Get canonical work
      operationId: getWork
      parameters:
        - $ref: '#/components/parameters/WorkID'
      responses:
        "200":
          description: Work
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Work'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
  /works/{id}/editions:
    get:
      summary: List editions for a work
      operationId: listEditionsForWork
      parameters:
        - $ref: '#/components/parameters/WorkID'
      responses:
        "200":
          description: Editions
          content:
            application/json:
              schema:
                type: object
                properties:
                  editions:
                    type: array
                    items: {$ref: '#/components/schemas/Edition'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
  /expressions/{id}:
    get:
      summary: Get canonical expression
      operationId: getExpression
      parameters:
        - $ref: '#/components/parameters/ExpressionID'
      responses:
        "200":
          description: Expression
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Expression'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
  /editions/{id}:
    get:
      summary: Get canonical edition
      operationId: getEdition
      parameters:
        - $ref: '#/components/parameters/EditionID'
      responses:
        "200":
          description: Edition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Edition'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
  /people/{id}:
    get:
      summary: Get canonical person
      operationId: getPerson
      parameters:
        - $ref: '#/components/parameters/PersonID'
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Person'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
  /people/{id}/works:
    get:
      summary: List works for a person
      operationId: listWorksForPerson
      parameters:
        - $ref: '#/components/parameters/PersonID'
      responses:
        "200":
          description: Works
          content:
            application/json:
              schema:
                type: object
                properties:
                  works:
                    type: array
                    items: {$ref: '#/components/schemas/Work'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
  /organizations/{id}:
    get:
      summary: Get canonical organization
      operationId: getOrganization
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
  /resolve:
    get:
      summary: Resolve standard/source identifier
      operationId: resolve
      parameters:
        - in: query
          name: namespace
          required: true
          schema: {type: string}
        - in: query
          name: value
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Resolution
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resolution'}
        "400":
          description: Missing namespace or value
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "401": {$ref: '#/components/responses/Unauthorized'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "429": {$ref: '#/components/responses/TooManyRequests'}
        "503": {$ref: '#/components/responses/ServiceUnavailable'}
