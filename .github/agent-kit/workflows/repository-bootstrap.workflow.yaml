version: 1
workflow_id: repository-bootstrap
objective: Establish repository/platform foundations without feature implementation.
states:
  - TRIAGE
  - ARCHITECTURE_CHECK
  - DECOMPOSE
  - PARALLEL_FOUNDATION
  - REVIEW
  - INTEGRATE
  - VERIFY
  - DONE
tasks:
  - id: platform
    route: platform-devex
    owns:
      - .devcontainer/**
      - Taskfile.yml
      - compose.dev.yaml
      - root dependency manifests
    reviewers: [qa-reviewer, security-reviewer, devops-release]
  - id: ci
    route: devops-release
    owns:
      - .github/workflows/**
      - deployment/containers/**
    reviewers: [security-reviewer, qa-reviewer]
  - id: api-skeleton
    route: backend-api
    owns:
      - internal/api/**
      - api/openapi/**
    reviewers: [api-compat-reviewer, qa-reviewer]
  - id: events-skeleton
    route: distributed-systems
    owns:
      - internal/events/**
      - schemas/events/**
    reviewers: [qa-reviewer]
constraints:
  - orchestrator_cannot_implement: true
  - source_connectors_out_of_scope: true
  - reconciliation_out_of_scope: true
