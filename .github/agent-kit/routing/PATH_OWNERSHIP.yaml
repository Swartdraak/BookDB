version: 1
owners:
- agent: database
  paths:
  - migrations/**
  - internal/database/**
  - internal/persistence/**
  - internal/outbox/store/**
  exclusive: true
- agent: postgres-ha
  paths:
  - deployment/postgres/**
  - deployment/ha/postgres/**
  - monitoring/postgres/**
  - scripts/ha/postgres/**
  exclusive: true
- agent: distributed-systems
  paths:
  - internal/events/**
  - internal/messaging/**
  - internal/outbox/publisher/**
  - schemas/events/**
  - deployment/nats/**
  exclusive: true
- agent: source-scheduler
  paths:
  - internal/scheduler/**
  - internal/sourcejobs/**
  - config/schedules/**
  exclusive: true
- agent: source-connector
  paths:
  - internal/sources/connectors/*/**
  - testdata/sources/*/**
  exclusive: true
  lease_parameter: source
- agent: identity-resolution
  paths:
  - internal/identity/**
  - testdata/identity/**
  exclusive: true
- agent: reconciliation
  paths:
  - internal/reconcile/**
  - internal/canonical/**
  - testdata/reconcile/**
  exclusive: true
- agent: search
  paths:
  - internal/search/**
  - schemas/search/**
  - deployment/opensearch/**
  - testdata/search/**
  exclusive: true
- agent: asset-storage
  paths:
  - internal/assets/**
  - internal/objectstore/**
  - deployment/storage/**
  - testdata/assets/**
  exclusive: true
- agent: backend-api
  paths:
  - internal/api/**
  - api/openapi/**
  - sdk/generation/**
  - testdata/api/**
  exclusive: true
- agent: auth-identity
  paths:
  - internal/auth/**
  - internal/rbac/**
  - internal/accounts/**
  - testdata/auth/**
  exclusive: true
- agent: frontend
  paths:
  - web/**
  exclusive: true
- agent: platform-devex
  paths:
  - .devcontainer/**
  - scripts/dev/**
  - compose*.yml
  - compose*.yaml
  - Makefile
  - Taskfile.yml
  - go.mod
  - go.sum
  - package.json
  - pnpm-lock.yaml
  - .editorconfig
  - .gitattributes
  - .gitignore
  exclusive: true
- agent: devops-release
  paths:
  - .github/workflows/**
  - deployment/containers/**
  - scripts/release/**
  - release/**
  exclusive: true
- agent: documentation-writer
  paths:
  - docs/**
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  exclusive: true
unowned_policy: ROUTE_TO_SYSTEM_ARCHITECT
