      # - name: Validate task and authority lease
      #   run: |
      #     python tools/validate_contract.py task ".agent-state/tasks/${TASK_ID}.yaml"
      #     python tools/validate_contract.py lease ".agent-state/leases/${LEASE_ID}.yaml"
