name: Agent Governance

on:
  pull_request:

jobs:
  validate-agent-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r tools/requirements-agent-kit.txt

      - name: Validate canonical agent kit
        run: python tools/validate_agent_kit.py

      - name: Detect recovery ledger artifacts
        id: ledger_artifacts
        shell: bash
        run: |
          changed_files="$(mktemp)"
          ledger_files="$(mktemp)"

          trap 'rm -f "$changed_files" "$ledger_files"' EXIT

          git diff -z --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > "$changed_files"

          while IFS= read -r -d '' path; do
            case "$path" in
              .agent-state/ledger/*.yaml)
                printf '%s\0' "$path" >> "$ledger_files"
                ;;
            esac
          done < "$changed_files"

          if [[ -s "$ledger_files" ]]; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            echo "ledger_files=$ledger_files" >> "$GITHUB_OUTPUT"
          else
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate recovery ledger artifacts
        if: steps.ledger_artifacts.outputs.run_checks == 'true' && steps.ledger_artifacts.outputs.ledger_files != ''
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            python tools/validate_contract.py ledger "$file"
          done < "${{ steps.ledger_artifacts.outputs.ledger_files }}"

      # Enable this block when PR conventions export TASK_ID/LEASE_ID
      # or derive them through a small repository-specific action.
