name: Agent Governance

on:
  pull_request:

jobs:
  validate-agent-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r tools/requirements-agent-kit.txt

      - name: Validate canonical agent kit
        run: python tools/validate_agent_kit.py

