name: Security Supply Chain

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect dependency graph availability
        id: dep-graph
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const status = data?.security_and_analysis?.dependency_graph?.status;
              const enabled = status === "enabled";
              core.info(`dependency_graph.status=${status ?? "unknown"}`);
              if (!enabled) {
                core.setFailed("Dependency graph must be explicitly enabled to enforce dependency review. Enable it in repository Settings > Security & analysis, then re-run this workflow.");
              }
            } catch (error) {
              core.setFailed(`Could not determine dependency graph status. Dependency review is fail-closed until this is readable. Error: ${error.message}`);
            }

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          license-check: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-banner --redact --exit-code 1

  sbom-and-image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build devcontainer image
        run: docker build -f .devcontainer/Dockerfile -t bookdb-devcontainer:${{ github.sha }} .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: bookdb-devcontainer:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bookdb-devcontainer:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH