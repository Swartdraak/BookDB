name: Agent Governance

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-agent-kit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install agent-kit requirements
        run: pip install -r tools/requirements-agent-kit.txt

      - name: Validate canonical agent kit
        run: python tools/validate_agent_kit.py

  validate-task-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install agent-kit requirements
        run: pip install -r tools/requirements-agent-kit.txt

      - name: Detect task packet and authority lease artifacts
        id: artifacts
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.sha }}"
          changed_files="$(git diff --name-only "${base_sha}" "${head_sha}")"

          task_files=""
          lease_files=""
          non_agent_state_changes=0

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue

            case "$path" in
              .agent-state/*)
                ;;
              *)
                non_agent_state_changes=1
                ;;
            esac

            case "$path" in
              .agent-state/tasks/*.yaml)
                task_files="${task_files}${task_files:+ }$path"
                ;;
              .agent-state/leases/*.yaml)
                lease_files="${lease_files}${lease_files:+ }$path"
                ;;
            esac
          done <<< "$changed_files"

          echo "non_agent_state_changes=${non_agent_state_changes}" >> "$GITHUB_OUTPUT"
          if [[ -n "$task_files" || -n "$lease_files" ]]; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            echo "task_files=$task_files" >> "$GITHUB_OUTPUT"
            echo "lease_files=$lease_files" >> "$GITHUB_OUTPUT"
          else
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate task packets
        if: steps.artifacts.outputs.run_checks == 'true' && steps.artifacts.outputs.task_files != ''
        shell: bash
        run: |
          for file in ${{ steps.artifacts.outputs.task_files }}; do
            python tools/validate_contract.py task "$file"
          done

      - name: Validate changed authority lease artifacts
        if: steps.artifacts.outputs.run_checks == 'true' && steps.artifacts.outputs.lease_files != ''
        shell: bash
        run: |
          for file in ${{ steps.artifacts.outputs.lease_files }}; do
            python tools/validate_contract.py lease "$file"
          done

      - name: Require task-bound active lease for non-.agent-state changes
        id: active_branch_leases
        if: steps.artifacts.outputs.non_agent_state_changes == '1'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          head_branch = os.environ.get("HEAD_BRANCH", "").strip()
          if not head_branch:
              raise SystemExit("ERROR: cannot determine current PR head branch")

          head_repo = os.environ.get("HEAD_REPO", "").strip()
          repo_name = os.environ.get("GITHUB_REPOSITORY", "").strip()
          if head_repo and repo_name and head_repo != repo_name:
              raise SystemExit(
                  f"ERROR: PR head repository '{head_repo}' does not match base repository '{repo_name}'"
              )

          base_sha = os.environ.get("BASE_SHA", "").strip()
          head_sha = os.environ.get("HEAD_SHA", "").strip()
          if not base_sha or not head_sha:
              raise SystemExit("ERROR: cannot determine PR diff range")

          proc = subprocess.run(
              ["git", "diff", "--name-only", f"{base_sha}", f"{head_sha}"],
              capture_output=True,
              text=True,
              check=False,
          )
          if proc.returncode != 0:
              print(proc.stderr, file=sys.stderr)
              raise SystemExit(proc.returncode)

          changed_files = [line.strip().replace("\\", "/") for line in proc.stdout.splitlines() if line.strip()]
          changed_task_files = [path for path in changed_files if path.startswith(".agent-state/tasks/") and path.endswith(".yaml")]
          changed_lease_files = [path for path in changed_files if path.startswith(".agent-state/leases/") and path.endswith(".yaml")]

          active_task_states = {
              "LEASED",
              "IN_PROGRESS",
              "HANDOFF_SUBMITTED",
              "REVIEW_PENDING",
              "CHANGES_REQUESTED",
              "VERIFYING",
          }

          task_lookup = {}
          for task_path in changed_task_files:
              try:
                  payload = yaml.safe_load(Path(task_path).read_text(encoding="utf-8")) or {}
              except Exception as exc:  # pragma: no cover - defensive on malformed YAML
                  print(f"WARN: skipping unreadable task {task_path}: {exc}")
                  continue

              task_id = str(payload.get("task_id", "")).strip()
              if not task_id:
                  continue

              task_lookup[task_id] = {
                  "path": task_path,
                  "state": str(payload.get("state", "")).upper(),
                  "assigned_agent": str(payload.get("assigned_agent", "")).strip(),
              }

          eligible = []
          for lease_path in changed_lease_files:
              try:
                  payload = yaml.safe_load(Path(lease_path).read_text(encoding="utf-8")) or {}
              except Exception as exc:  # pragma: no cover - defensive on malformed YAML
                  print(f"WARN: skipping unreadable lease {lease_path}: {exc}")
                  continue

              if str(payload.get("status", "")).upper() != "ACTIVE":
                  continue
              if str(payload.get("branch", "")).strip() != head_branch:
                  continue

              lease_base_commit = str(payload.get("base_commit", "")).strip()
              if lease_base_commit and lease_base_commit != base_sha:
                  continue

              expires_at = payload.get("expires_at")
              if expires_at:
                  try:
                      expires = dt.datetime.fromisoformat(str(expires_at).replace("Z", "+00:00"))
                      if expires.tzinfo is None:
                          expires = expires.replace(tzinfo=dt.timezone.utc)
                      if expires <= dt.datetime.now(dt.timezone.utc):
                          continue
                  except ValueError:
                      print(f"WARN: malformed expires_at in {lease_path}; skipping")
                      continue

              task_id = str(payload.get("task_id", "")).strip()
              if not task_id:
                  continue

              task = task_lookup.get(task_id)
              if not task:
                  continue
              if task["state"] not in active_task_states:
                  continue

              lease_agent = str(payload.get("agent_id", "")).strip()
              task_agent = task["assigned_agent"]
              if task_agent and lease_agent and task_agent != lease_agent:
                  continue

              eligible.append(lease_path)

          if not eligible:
              print(
                  f"ERROR: PR contains non-.agent-state changes but no ACTIVE lease changed in this PR "
                  f"matches branch '{head_branch}', the PR base commit, and a changed task artifact "
                  "in an active execution state. Failing closed."
              )
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("relevant_active_lease_files<<EOF\n")
              fh.write(" ".join(eligible))
              fh.write("\nEOF\n")
          print(f"Eligible task-bound ACTIVE leases for branch '{head_branch}': {', '.join(eligible)}")
          PY

      - name: Validate relevant active leases against their own base...head diff
        if: steps.artifacts.outputs.non_agent_state_changes == '1'
        shell: bash
        run: |
          for file in ${{ steps.active_branch_leases.outputs.relevant_active_lease_files }}; do
            python tools/check_lease_diff.py --lease "$file"
          done
