name: Agent Governance

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-agent-kit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install agent-kit requirements
        run: pip install -r tools/requirements-agent-kit.txt

      - name: Validate canonical agent kit
        run: python tools/validate_agent_kit.py

  validate-task-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install agent-kit requirements
        run: pip install -r tools/requirements-agent-kit.txt

      - name: Detect task packet and authority lease artifacts
        id: artifacts
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.sha }}"
          changed_files="$(git diff --name-only "${base_sha}" "${head_sha}")"

          task_files=""
          lease_files=""
          handoff_files=""
          non_agent_state_changes=0

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue

            case "$path" in
              .agent-state/*)
                ;;
              *)
                non_agent_state_changes=1
                ;;
            esac

            case "$path" in
              .agent-state/tasks/*.yaml)
                task_files="${task_files}${task_files:+ }$path"
                ;;
              .agent-state/leases/*.yaml)
                lease_files="${lease_files}${lease_files:+ }$path"
                ;;
              .agent-state/handoffs/*/handoff.yaml)
                handoff_files="${handoff_files}${handoff_files:+ }$path"
                ;;
            esac
          done <<< "$changed_files"

          echo "non_agent_state_changes=${non_agent_state_changes}" >> "$GITHUB_OUTPUT"
          if [[ -n "$task_files" || -n "$lease_files" || -n "$handoff_files" ]]; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            echo "task_files=$task_files" >> "$GITHUB_OUTPUT"
            echo "lease_files=$lease_files" >> "$GITHUB_OUTPUT"
            echo "handoff_files=$handoff_files" >> "$GITHUB_OUTPUT"
          else
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate task packets
        if: steps.artifacts.outputs.run_checks == 'true' && steps.artifacts.outputs.task_files != ''
        shell: bash
        run: |
          for file in ${{ steps.artifacts.outputs.task_files }}; do
            python tools/validate_contract.py task "$file"
          done

      - name: Validate changed authority lease artifacts
        if: steps.artifacts.outputs.run_checks == 'true' && steps.artifacts.outputs.lease_files != ''
        shell: bash
        run: |
          for file in ${{ steps.artifacts.outputs.lease_files }}; do
            python tools/validate_contract.py lease "$file"
          done

      - name: Validate changed handoff artifacts
        if: steps.artifacts.outputs.run_checks == 'true' && steps.artifacts.outputs.handoff_files != ''
        shell: bash
        run: |
          for file in ${{ steps.artifacts.outputs.handoff_files }}; do
            python tools/validate_contract.py handoff "$file"
          done

      - name: Require task-bound active lease for non-.agent-state changes
        if: steps.artifacts.outputs.non_agent_state_changes == '1'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          import yaml


          def matches(path: str, pattern: str) -> bool:
            if "<" in pattern or ">" in pattern:
              return False

            candidate = PurePosixPath(path)
            return candidate.match(pattern) or (
              pattern.endswith("/**")
              and (path == pattern[:-3].rstrip("/") or path.startswith(pattern[:-3]))
            )


          def normalize_paths(values):
            return [str(value).strip().replace("\\", "/") for value in values if str(value).strip()]


          head_branch = os.environ.get("HEAD_BRANCH", "").strip()
          if not head_branch:
            raise SystemExit("ERROR: cannot determine current PR head branch")

          head_repo = os.environ.get("HEAD_REPO", "").strip()
          repo_name = os.environ.get("GITHUB_REPOSITORY", "").strip()
          if head_repo and repo_name and head_repo != repo_name:
            raise SystemExit(
              f"ERROR: PR head repository '{head_repo}' does not match base repository '{repo_name}'"
            )

          base_sha = os.environ.get("BASE_SHA", "").strip()
          head_sha = os.environ.get("HEAD_SHA", "").strip()
          if not base_sha or not head_sha:
            raise SystemExit("ERROR: cannot determine PR diff range")

          proc = subprocess.run(
            ["git", "diff", "--name-only", f"{base_sha}", f"{head_sha}"],
            capture_output=True,
            text=True,
            check=False,
          )
          if proc.returncode != 0:
            print(proc.stderr, file=sys.stderr)
            raise SystemExit(proc.returncode)

          changed_files = [line.strip().replace("\\", "/") for line in proc.stdout.splitlines() if line.strip()]
          pr_changed_files = [path for path in changed_files if not path.startswith(".agent-state/")]
          changed_lease_files = [path for path in changed_files if path.startswith(".agent-state/leases/") and path.endswith(".yaml")]

          active_task_states = {
            "LEASED",
            "IN_PROGRESS",
            "HANDOFF_SUBMITTED",
            "REVIEW_PENDING",
            "CHANGES_REQUESTED",
            "VERIFYING",
          }

          lease_allow_all = set()
          checked_leases = []

          for lease_path in changed_lease_files:
            try:
              lease_payload = yaml.safe_load(Path(lease_path).read_text(encoding="utf-8")) or {}
            except Exception as exc:  # pragma: no cover - defensive on malformed YAML
              print(f"WARN: skipping unreadable lease {lease_path}: {exc}")
              continue

            if str(lease_payload.get("status", "")).upper() != "ACTIVE":
              continue
            if str(lease_payload.get("branch", "")).strip() != head_branch:
              continue

            expires_at = lease_payload.get("expires_at")
            if expires_at:
              try:
                expires = dt.datetime.fromisoformat(str(expires_at).replace("Z", "+00:00"))
                if expires.tzinfo is None:
                  expires = expires.replace(tzinfo=dt.timezone.utc)
                if expires <= dt.datetime.now(dt.timezone.utc):
                  continue
              except ValueError:
                print(f"WARN: malformed expires_at in {lease_path}; skipping")
                continue

            task_id = str(lease_payload.get("task_id", "")).strip()
            if not task_id:
              continue

            task_path = Path(f".agent-state/tasks/{task_id}.yaml")
            if not task_path.exists():
              print(f"ERROR: missing task artifact for active lease task {task_id}: {task_path}")
              sys.exit(1)

            try:
              task_payload = yaml.safe_load(task_path.read_text(encoding="utf-8")) or {}
            except Exception as exc:  # pragma: no cover - defensive on malformed YAML
              print(f"ERROR: unreadable task {task_path}: {exc}")
              sys.exit(1)

            if str(task_payload.get("task_id", "")).strip() != task_id:
              print(f"ERROR: task {task_path} does not match lease task_id {task_id}")
              sys.exit(1)
            if str(task_payload.get("state", "")).upper() not in active_task_states:
              continue

            lease_agent = str(lease_payload.get("agent_id", "")).strip()
            task_agent = str(task_payload.get("assigned_agent", "")).strip()
            if task_agent and lease_agent and task_agent != lease_agent:
              continue

            handoff_path = Path(f".agent-state/handoffs/{task_id}/handoff.yaml")
            if not handoff_path.exists():
              print(f"ERROR: missing handoff artifact for active lease task {task_id}: {handoff_path}")
              sys.exit(1)

            try:
              handoff_payload = yaml.safe_load(handoff_path.read_text(encoding="utf-8")) or {}
            except Exception as exc:  # pragma: no cover - defensive on malformed YAML
              print(f"ERROR: unreadable handoff {handoff_path}: {exc}")
              sys.exit(1)

            if str(handoff_payload.get("task_id", "")).strip() != task_id:
              print(f"ERROR: handoff {handoff_path} does not match task {task_id}")
              sys.exit(1)
            if str(handoff_payload.get("lease_id", "")).strip() != str(lease_payload.get("lease_id", "")).strip():
              print(f"ERROR: handoff {handoff_path} does not match lease {lease_payload.get('lease_id', '')}")
              sys.exit(1)
            if lease_agent and str(handoff_payload.get("agent_id", "")).strip() != lease_agent:
              print(f"ERROR: handoff {handoff_path} agent_id does not match lease {lease_path}")
              sys.exit(1)

            lease_base_commit = str(lease_payload.get("base_commit", "")).strip()
            if not lease_base_commit:
              print(f"ERROR: lease {lease_path} has no base_commit")
              sys.exit(1)

            diff_proc = subprocess.run(
              ["git", "diff", "--name-only", f"{lease_base_commit}", f"{head_sha}"],
              capture_output=True,
              text=True,
              check=False,
            )
            if diff_proc.returncode != 0:
              print(diff_proc.stderr, file=sys.stderr)
              raise SystemExit(diff_proc.returncode)

            lease_diff_files = {
              line.strip().replace("\\", "/")
              for line in diff_proc.stdout.splitlines()
              if line.strip()
            }

            claimed_files = normalize_paths(handoff_payload.get("changed_files", []))
            claimed_non_agent_files = [path for path in claimed_files if not path.startswith(".agent-state/")]

            lease_allow = list(lease_payload.get("write_allow", []))
            lease_deny = list(lease_payload.get("write_deny", []))

            for path in claimed_non_agent_files:
              if path not in lease_diff_files:
                print(
                  f"ERROR: handoff {handoff_path} claims '{path}' outside lease base_commit '{lease_base_commit}'"
                )
                sys.exit(1)

              denied = any(matches(path, pattern) for pattern in lease_deny)
              allowed = any(matches(path, pattern) for pattern in lease_allow)
              if denied or not allowed:
                reason = "explicitly denied" if denied else "outside write_allow"
                print(f"ERROR: {path}: {reason} for lease {lease_path}")
                sys.exit(1)

            lease_allow_all.update(claimed_non_agent_files)
            checked_leases.append(lease_path)

          if not checked_leases:
            print(
              f"ERROR: PR contains non-.agent-state changes but no ACTIVE lease changed in this PR "
              f"matches branch '{head_branch}' and a changed task artifact in an active execution state. "
              "Failing closed."
            )
            sys.exit(1)

          missing_pr_files = sorted(set(pr_changed_files) - lease_allow_all)
          if missing_pr_files:
            print("ERROR: PR contains non-.agent-state changes not covered by any active task handoff:")
            for path in missing_pr_files:
              print(f"  - {path}")
            sys.exit(1)

          extra_claims = sorted(lease_allow_all - set(pr_changed_files))
          if extra_claims:
            print("ERROR: active task handoffs claim files not present in the PR diff:")
            for path in extra_claims:
              print(f"  - {path}")
            sys.exit(1)

          print(
            f"Eligible task-bound ACTIVE leases for branch '{head_branch}': {', '.join(checked_leases)}"
          )
          PY
