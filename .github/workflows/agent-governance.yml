name: Agent Governance

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-agent-kit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install agent-kit requirements
        run: pip install -r tools/requirements-agent-kit.txt

      - name: Validate canonical agent kit
        run: python tools/validate_agent_kit.py

  validate-task-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install agent-kit requirements
        run: pip install -r tools/requirements-agent-kit.txt

      - name: Detect task packet and authority lease artifacts
        id: artifacts
        shell: bash
        run: |
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          task_files=""
          lease_files=""

          while IFS= read -r path; do
            case "$path" in
              .agent-state/tasks/*.yaml)
                task_files="${task_files}${task_files:+ }$path"
                ;;
              .agent-state/leases/*.yaml)
                lease_files="${lease_files}${lease_files:+ }$path"
                ;;
            esac
          done <<< "$changed_files"

          if [[ -n "$task_files" || -n "$lease_files" ]]; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            echo "task_files=$task_files" >> "$GITHUB_OUTPUT"
            echo "lease_files=$lease_files" >> "$GITHUB_OUTPUT"
          else
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate task packets
        if: steps.artifacts.outputs.run_checks == 'true' && steps.artifacts.outputs.task_files != ''
        shell: bash
        run: |
          for file in ${{ steps.artifacts.outputs.task_files }}; do
            python tools/validate_contract.py task "$file"
          done

      - name: Validate authority leases
        if: steps.artifacts.outputs.run_checks == 'true' && steps.artifacts.outputs.lease_files != ''
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.sha }}"

          for file in ${{ steps.artifacts.outputs.lease_files }}; do
            python tools/validate_contract.py lease "$file"

            python - "$file" "$base_sha" "$head_sha" <<'PY'
            import subprocess
            import sys
            from pathlib import PurePosixPath

            import yaml

            path, base_sha, head_sha = sys.argv[1], sys.argv[2], sys.argv[3]

            def read_yaml(text: str):
                return yaml.safe_load(text) or {}

            def git_show(ref: str, repo_path: str):
                proc = subprocess.run(
                    ["git", "show", f"{ref}:{repo_path}"],
                    capture_output=True,
                    text=True,
                )
                if proc.returncode != 0:
                    return None
                return proc.stdout

            def matches(path_value: str, pattern: str) -> bool:
                if "<" in pattern or ">" in pattern:
                    return False
                p = PurePosixPath(path_value)
                return p.match(pattern) or (
                    pattern.endswith("/**")
                    and (path_value == pattern[:-3].rstrip("/") or path_value.startswith(pattern[:-3]))
                )

            with open(path, "r", encoding="utf-8") as f:
                head_lease = read_yaml(f.read())

            head_status = str(head_lease.get("status", "")).upper()
            if head_status != "ACTIVE":
                print(f"ERROR: lease {path} status is {head_status}, expected ACTIVE")
                raise SystemExit(1)

            base_text = git_show(base_sha, path)
            if base_text is None:
                effective_lease = head_lease
            else:
                base_lease = read_yaml(base_text)
                base_status = str(base_lease.get("status", "")).upper()
                if base_status != "ACTIVE":
                    print(f"ERROR: trusted baseline lease {path} status is {base_status}, expected ACTIVE")
                    raise SystemExit(1)
                effective_lease = base_lease

            changed = subprocess.run(
                ["git", "diff", "--name-only", f"{base_sha}...{head_sha}"],
                capture_output=True,
                text=True,
                check=True,
            ).stdout.splitlines()
            changed = [line.strip().replace("\\", "/") for line in changed if line.strip()]

            allow = effective_lease.get("write_allow", [])
            deny = effective_lease.get("write_deny", [])
            relevant = [entry for entry in changed if any(matches(entry, pattern) for pattern in allow)]

            violations = []
            for entry in relevant:
                if any(matches(entry, pattern) for pattern in deny):
                    violations.append((entry, "explicitly denied"))
                elif not any(matches(entry, pattern) for pattern in allow):
                    violations.append((entry, "outside write_allow"))

            if violations:
                print(f"LEASE VIOLATIONS for {path}:")
                for entry, reason in violations:
                    print(f"  - {entry}: {reason}")
                raise SystemExit(1)

            print(f"PASS: {path} scope is valid against trusted baseline lease content.")
            PY
          done