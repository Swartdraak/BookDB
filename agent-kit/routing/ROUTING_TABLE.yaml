version: 1
routes:
- match: repository bootstrap/dev environment/root manifests
  lead: platform-devex
  planning:
  - system-architect
  assurance:
  - qa-reviewer
  - security-reviewer
  - devops-release
- match: database schema/migration/query/index/repository
  lead: database
  planning:
  - bibliographic-domain if canonical semantics change
  assurance:
  - qa-reviewer
- match: postgres replication/patroni/pgbouncer/pitr/failover
  lead: postgres-ha
  planning:
  - system-architect if topology changes
  assurance:
  - ha-reviewer
  - security-reviewer
- match: nats/jetstream/event/outbox/idempotency/dead-letter
  lead: distributed-systems
  planning:
  - system-architect if new durable contract family
  assurance:
  - qa-reviewer
  - security-reviewer
- match: source schedule/manual sync/jitter/rate budget/checkpoint orchestration
  lead: source-scheduler
  planning:
  - source-governance
  assurance:
  - source-policy-reviewer
  - qa-reviewer
- match: new or changed metadata source connector
  lead: source-connector
  planning:
  - source-governance
  assurance:
  - source-policy-reviewer
  - qa-reviewer
  - security-reviewer
- match: entity matching/candidates/identifier graph/contradiction gate
  lead: identity-resolution
  planning:
  - bibliographic-domain
  assurance:
  - qa-reviewer
  - performance-reviewer
- match: canonical claim selection/field authority/inheritance
  lead: reconciliation
  planning:
  - bibliographic-domain
  - source-governance when source eligibility changes
  assurance:
  - qa-reviewer
- match: opensearch/search/relevance/index mapping/reindex
  lead: search
  planning:
  - system-architect if topology changes
  assurance:
  - qa-reviewer
  - performance-reviewer
- match: s3/object storage/asset processing/image storage
  lead: asset-storage
  planning:
  - source-governance for rights
  assurance:
  - source-policy-reviewer
  - security-reviewer
  - qa-reviewer
- match: rest/openapi/dto/pagination/etag/change feed
  lead: backend-api
  planning:
  - system-architect if breaking architecture
  - bibliographic-domain if semantics change
  assurance:
  - api-compat-reviewer
  - qa-reviewer
  - security-reviewer
- match: local auth/oidc/rbac/api key/account linking
  lead: auth-identity
  planning:
  - system-architect if trust boundary changes
  assurance:
  - security-reviewer
  - qa-reviewer
- match: react/webui/admin/contributor/public ui
  lead: frontend
  planning:
  - product-manager
  assurance:
  - qa-reviewer
  - security-reviewer
  - documentation-reviewer
- match: ci/cd/container build/release/sbom/signing
  lead: devops-release
  planning:
  - system-architect if deployment contract changes
  assurance:
  - security-reviewer
  - qa-reviewer
- match: documentation only
  lead: documentation-writer
  planning: []
  assurance:
  - documentation-reviewer
- match: scope/acceptance/milestone/risk
  lead: product-manager
  planning: []
  assurance: []
- match: architecture/adr/new dependency/unowned path
  lead: system-architect
  planning: []
  assurance: []
- match: work-expression-edition/series/identifier/contributor semantics
  lead: bibliographic-domain
  planning: []
  assurance: []
- match: source license/terms/persistence/redistribution/attribution
  lead: source-governance
  planning: []
  assurance: []
fallback: orchestrator must classify; if no route matches, delegate to system-architect
  for ownership decision; orchestrator never implements
